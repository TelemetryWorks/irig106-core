name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: always

jobs:
  workflows:
    name: Workflow audits (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/release/install_action_tools.py "$RUNNER_TEMP/action-tools"
      - run: '"$RUNNER_TEMP/action-tools/actionlint"'
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/action-tools/zizmor" --no-progress .github/workflows
          "$RUNNER_TEMP/action-tools/zizmor" --no-progress --persona auditor .github/workflows/trusted-publishing.yml

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: cargo test --workspace --locked
      - name: Maximum setup at default H/B (128 MiB, generated in core process)
        if: matrix.os == 'ubuntu-24.04'
        run: cargo test -p irig106-core --test whole --locked maximum_setup_fits_default_h_and_b -- --ignored --exact
      - name: Bounded warm-cache file read benchmark (informational)
        if: matrix.os == 'ubuntu-24.04'
        run: cargo test -p irig106-core --test whole --locked bounded_file_read_benchmark -- --ignored --exact --nocapture
      - name: Small-body comparison (informational, 32 MiB per case)
        if: matrix.os == 'ubuntu-24.04'
        env:
          IRIG106_SMALL_BODY_BENCH_BYTES: "33554432"
        run: cargo test --release -p irig106-core --test read_strategy_bench --locked small_body_read_strategy_benchmark -- --ignored --exact --nocapture

  contract:
    name: Workspace, lint, docs and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: python3 scripts/test_workspace.py
      - run: python3 scripts/test_rss_probe.py
      - run: python3 scripts/test_whole_resources.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run public inspect example fixtures
        run: |
          cargo build -p irig106-core --example inspect --locked
          python3 scripts/test_inspect_example.py target/debug/examples/inspect
      - name: Run ordered whole-packet consumer fixtures
        run: |
          cargo test -p irig106-core --example ordered --locked
          cargo build -p irig106-core --example ordered --locked
          python3 scripts/test_ordered_example.py target/debug/examples/ordered
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: List and verify packaged crate
        run: |
          cargo package -p irig106-core --list --locked
          cargo package -p irig106-core --locked

  rss:
    name: Isolated core RSS (32 MiB)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: df -h .
      - run: /usr/bin/time --version
      - run: cargo build -p irig106-core --example rss_probe --release --locked
      - name: Measure prebuilt core process only
        run: python3 scripts/check_rss.py target/release/examples/rss_probe

  msrv:
    name: MSRV (1.85.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.85.0"
      - run: cargo check --workspace --locked

  deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          arguments: --locked --all-features

  whole-memory:
    name: Whole memory (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: cargo build --release -p irig106-core --example whole_resources --locked
      - run: python3 scripts/check_whole_resources.py target/release/examples/whole_resources${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: One-off memory controls (discard after evidence)
        if: runner.os == 'Linux'
        run: python3 scripts/control_whole_resources.py

  target32:
    name: Executed 32-bit Windows tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: i686-pc-windows-msvc
      - run: cargo test --workspace --locked --target i686-pc-windows-msvc
